# Ships the desktop app. Run it from the Actions tab with the version to
# release (e.g. 0.2.0): it bumps maki-gui's version, tags vX.Y.Z on main,
# builds every platform and publishes the release the app updates from.
# Pushing a vX.Y.Z tag by hand runs the same build for that tag.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 0.2.0
        required: true
        type: string
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  GUI_DEPS: libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev libzstd-dev libasound2-dev

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Tag and draft
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Bump version and tag
        id: tag
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="${INPUT_VERSION#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a semver version"
            exit 1
          fi
          python3 .github/scripts/set_gui_version.py "$version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet || git commit -am "Release v$version"
          git tag "v$version"
          git push origin HEAD:main "v$version"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
        env:
          INPUT_VERSION: ${{ inputs.version }}

      - name: Create draft release
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --draft --title "Helajica $tag" --generate-notes

  build:
    name: Build (${{ matrix.os }}-${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            os: windows
            arch: x86_64
            exe: .exe
          - runner: macos-latest
            os: macos
            arch: aarch64
            exe: ""
          - runner: ubuntu-latest
            os: linux
            arch: x86_64
            exe: ""
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: Install GUI system libraries
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y $GUI_DEPS

      - name: Build
        run: cargo build --release --locked --bin helajica

      - name: Upload
        run: |
          asset="helajica-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.exe }}"
          cp "target/release/helajica${{ matrix.exe }}" "$asset"
          gh release upload "${{ needs.prepare.outputs.tag }}" "$asset" --clobber

      # The bare exe above is what installed apps update from; these are for
      # first installs. Both install per user, so updates need no admin.
      - name: Build and upload installers
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          $version = $env:TAG.TrimStart('v')
          $exe = "$PWD\target\release\helajica.exe"
          New-Item -ItemType Directory -Force dist | Out-Null
          dotnet tool install --global wix --version 5.0.2
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" build -arch x64 `
            -d Version=$($version.Split('-')[0]) -d Exe=$exe -d Icon=assets\helajica.ico `
            -o dist\helajica-windows-x86_64.msi packaging\windows\helajica.wxs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc /DAppVersion=$version /DExe=$exe /DOutDir="$PWD\dist" packaging\windows\helajica.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gh release upload $env:TAG dist\helajica-windows-x86_64.msi dist\helajica-windows-x86_64-setup.exe --clobber

  publish:
    name: Publish
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        run: gh release edit "${{ needs.prepare.outputs.tag }}" --draft=false --latest
